collect_namunews_trending:
  description: >
    Visit the Namunews website (https://namu.news/) and 
    extract currently trending keywords from its dedicated trending section (<ul class="mt-4 grid grid-cols-2 lg:block"></ul>).
    Return the extracted results as a JSON array in rank order without saving to a file.

    Important : Never scrape and extract from any websites other than the ones explicitly linked.
  expected_output: >
    JSON array containing the current trending keywords from Namunews,
    ordered by rank (e.g., ["Keyword1", "Keyword2", "Keyword3", ...]).
  agent: namunews_trending_scraper

collect_signal_trending:
  description: >
    Visit the Signal website (https://signal.bz/news) and 
    extract currently trending keywords from its dedicated trending section 
    (inside <div class="realtime-rank">, specifically the text elements <span class="rank-text">).
    Return the extracted results as a JSON array in rank order without saving to a file.

    Important : Never scrape and extract from any websites other than the ones explicitly linked.
  expected_output: >
    JSON array containing the current trending keywords from signal,
    ordered by rank (e.g., ["Keyword1", "Keyword2", "Keyword3", ...]).
  agent: signal_trending_scraper

collect_x_trending:
  description: >
    From getdaytrends (https://getdaytrends.com/ko/korea/), a site that shows X (Twitter) trends,
    extract keywords from the area containing X trend keywords (<div id="trends">).
    Extract not only current trends but also all keywords from the past 24 hours.
    Return the extracted results as a JSON array in rank order without saving to a file.

    Important : Never scrape and extract from any websites other than the ones explicitly linked.
  expected_output: >
    JSON array of current and past 24h trending keywords from X
    ordered by rank. (e.g., ["Keyword1", "Keyword2", "Keyword3", ...]).
  agent: x_trending_scraper

collect_google_trending:
  description: >
    Visit Google Trends (https://trends.google.com/trending?geo=KR&hours=24),
    scrape only the child elements that appear to be real-time trending in the area (<table class="enOdEe-wZVHld-zg7Cn"></table>).
    Return the extracted results as a JSON array in rank order without saving to a file.

    Important : Never scrape and extract from any websites other than the ones explicitly linked.
  expected_output: >
    JSON array of the current trending keywords from Google Trends,
    ordered by rank.(e.g., ["Keyword1", "Keyword2", "Keyword3", ...]).
  agent: google_trending_scraper

organize_trending:
  description: >
    Input is the trend keywords JSON arrays from context (results of collect_google_trending, collect_x_trending, collect_signal_trending, collect_namunews_trending)
    Combine them into a single JSON object grouped by source.
    Each key in the JSON object should be the service name (e.g., "namunews", "x", "google", "signal")
    and the value should be an array of keywords in order of ranking.
    Return JSON as context for the next task.
  expected_output: >
    Your response MUST be valid JSON, like this:
    {
      "namunews": [<list of strings>],
      "x": [<list of strings>],
      "google": [<list of strings>],
      "signal": [<list of strings>]
    }
    Your response MUST be valid JSON, following the format defined above. Do not include any extra commentary or markdown formatting.

  agent: trending_organizer

cross_validate_trending:
  description: >
    You will receive a JSON object from the previous task (organize_trending), which contains four lists of trending keywords
    from different platforms

    The input will look like this:
    {
      "namunews": [<list of strings>],
      "signal": [<list of strings>],
      "x": [<list of strings>],
      "google": [<list of strings>]
    }

    Goals:
    1) Identify the **Top 5 keywords** that appear most frequently across multiple services.
    2) Normalize/merge related keyword variations into a single representative keyword.

    Normalization rules (conservative):
    - Basic preprocessing: Unicode NFC, trim whitespace, lowercase (for English),
      collapse multiple spaces into one, strip punctuation at both ends.

    Here's the new rule set, which includes the category preservation logic.
      * **Anchor Token Identification**: Identify an anchor token (e.g., namhansanseong, mantis) that appears as an independent word.
      * **Keyword Mapping**: Map any keyword containing this anchor token to that anchor. The token can be at the **start**, **end**, or in the **middle** of the keyword, separated by a space or punctuation.
      * **Category Preservation Rule**: If a keyword includes a specific **category** (e.g., movie, drama, musical), the final merged result should retain this category information.
      * **People Word Rule**: If it is a person, please include their occupation before their name.

      - Examples:
        - "lck 페이커" (X), "lck geng" (Signal), "lck 결승" (Namunews) → "lck"
        - "페이커 lck" (X), "lck 젠지" (Signal) → "lck"   
        - "mlb 오타니" (Google), "mlb standings" (X) → "mlb"
        - "aespa concert" (Signal), "aespa 카리나" (Namunews) → "aespa"
        - "드라마 사마귀" (Signal), "사마귀" (Namunews) → "드라마 사마귀"
        - "남한산성 영화" (Signal), "영화 남한산성" (Namunews), "남한산성 평점" (Google) → "영화 남한산성"
        - "홍성호 야구선수" (Signal), "두산 홍성호" (Namunews), "홍성호" (Google) → "야구선수 홍성호"
    - Substring merging (optional): If an alphanumeric anchor of length ≥ 3 appears as
      a contiguous substring in another keyword, and the remaining part is a proper noun
      or modifier, merge under the anchor.
      - Example: "son heung-min" (X), "손흥민" (Namunews/Google) → "손흥민"
    - Exceptions: Do not use overly generic words (e.g., "news", "live") as anchors.
    - Manual alias dictionary, if provided, takes precedence
      (e.g., {"lck": ["lck 페이커", "lck 젠지", "페이커 lck"]}).
    - If no rule applies, the keyword remains its own representative.

    Counting and ranking:
    - For each representative keyword, compute:
      - The number of distinct services it appears in
      - The total number of mentions across all services
    - Sort by: (1) number of services (descending),
      (2) total mentions (descending),
      (3) relative order in the original lists if still tied.

    Fill-up rule:
    - If fewer than 5 representative keywords appear across multiple services,
      fill the remaining slots with keywords from the Google list (after normalization),
      in order of appearance, until there are exactly 5 items.

    Output:
    - Do not save to a file. Return a JSON of exactly 5 objects,
      each in the form {"keyword": "<representative>"}.

  expected_output: >
    Your response MUST be valid JSON, wrapped in a top-level key called "finalTop5", like this:
      {
        "finalTop5": [
          {"keyword": "정우성"},
          {"keyword": "안우진"},
          {"keyword": "시드니"},
          {"keyword": "손흥민"},
          {"keyword": "민생지원금"}
        ]
      }

    Do not include any markdown, explanations, or extra keys.

  agent: cross_validation_agent

explain_trends:
  description: >
    You will receive a list of 5 trending keywords via the context variable `cross_validate_trending`.
    These keywords represent the most prominent current trends in Korea.

    The input will look like this:
    {
      "finalTop5": [
        {"keyword": "정우성"},
        {"keyword": "안우진"},
        {"keyword": "시드니"},
        {"keyword": "손흥민"},
        {"keyword": "민생지원금"}
      ]
    }

    Goals:
      Perform real-time web research for each keyword and return a JSON where each item is an object containing:
        - "keyword": the keyword string
        - "why_trending": a concise but informative explanation in English


    Requirements for "why_trending":
    - Should be about 2 sentences long (roughly two lines of text).
    - Must clearly summarize the most recent and relevant reason the keyword is trending.
    - Should provide enough context to help the reader understand both the event itself
      and why it has gained public attention.
    - Avoid vague phrasing ("caused issues", "sparked debate") without specifics.
    - Do not exceed 3 sentences.

    Return exactly the same list of dictionaries as the final output.

  expected_output: >
    You must return a list of 5 dictionaries under a top-level key called "trendsWithWhy".
    Each dictionary must contain:
    {
      "trendsWithWhy": [
        {
          "keyword": "정우성",
          "why_trending": "Actor Jung Woo-sung is making headlines due to recent marriage rumors with a fellow celebrity. The speculation has been widely covered by entertainment outlets, drawing significant attention from fans and the public."
        },
        {
          "keyword": "안우진",
          "why_trending": "Baseball pitcher Ahn Woo-jin is trending after reports revealed a shoulder injury sustained during military service. The news has raised concerns about his future performance and impact on his team."
        },
        {
          "keyword": "시드니",
          "why_trending": "Sydney became a hot topic after controversy erupted over a new advertising slogan linked to the city. Public debate around cultural sensitivity and branding has fueled the discussion online."
        },
        {
          "keyword": "손흥민",
          "why_trending": "Soccer star Son Heung-min is praised for his outstanding recent performance in international matches. His leadership and candid post-match interviews have resonated strongly with fans worldwide."
        },
        {
          "keyword": "민생지원금",
          "why_trending": "The South Korean government announced a new round of financial aid aimed at supporting citizens during economic hardships. The policy has sparked nationwide discussion on eligibility and its potential economic impact."
        }
      ]
    }
      

    Your response MUST be valid JSON, following the format defined above. Do not include any extra commentary or markdown formatting.

  agent: trend_explainer
