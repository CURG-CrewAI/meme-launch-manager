extract_token_moods:
  description: >
    Your Input: {token_metadata}

    Goal:
      - Analyze the provided {token_metadata} (name, symbol, description) and generate three mood keywords in English that capture the token's core emotion and atmosphere.
      - These keywords will be used to guide the creative direction for meme-driven product visuals and fan communities.
      - Also RETURN the JSON so the next task can use it from context

    Constraints:
      - Do not produce synonyms or repetitive terms

    Output must be JSON object

  expected_output: >
    Your response MUST be valid JSON, like this:
      {"name":..., "mood_keywords":[...]}
    Do not include any markdown, explanations, or extra keys.

  agent: meme_mood_curator

write_website_contents:
  description: >
    Create a tokeonomics and roadmap based on the {token_metadata}.

    Your most important task is to maintain consistency.
    The `✨Features` items presented in {token_metadata}, **must** be taken and elaborated on in the `Special Features` section of `TOKENOMICS` that you will write.** Never ignore those ideas and create new mechanisms.

    💡 **Workflow Guide (Your Workflow):** 1.
    1. carefully read the `✨ Features` section of the satire you received as {token_metadata}.
    2. Use the names of the features as the title of the `Special Features` section of `TOKENOMICS` that you will write.
    3. Be creative and fun in explaining how each feature works specifically from a Tokenomics perspective (e.g., staking, burning, rewards, etc.).
    4. If you want to add a new mechanic that wasn't in the satire (e.g. general burning), it's okay to do so **after** you've described all the existing features.


    📊 tokenomics requirements:
    1. Total Supply: A ridiculous number (e.g. 420.69 trillion)
    2. Distribution:
    - Team: X% (with a ridiculous reason)
    - Marketing: X% (with a ridiculous marketing plan)
    - Liquidity: X 
    - Community: X% (with ridiculous community benefits)
    3. Special Features:
    **(required) Specifically describe ideas taken from the `✨Features` in the satire article**.
        
    🗺️ ROADMAP Requirements:
    Q1 2025: [Goal that sounds like a lie, but is slightly realistic]
    Q2 2025: [Goal that sounds so ridiculous it's almost impossible]
    Q3 2025: [Completely impossible goal that violates the laws of physics]
    Q4 2025: [Space conquest/time travel level goal].
        
    Format:
    📊 TOKENOMICS
    ================
    Total Supply: [Number].
        
    Distribution:
    - Team: X% - [funny description].
    - Marketing: X% - [ridiculous plan]
    - Liquidity: X% - [Exaggerated explanation].
    - Community: X% - [Ridiculous benefits].

    Special Features:
    - [Specifically describe ideas taken from the satire's `✨ Features`]
    - [Specifically describe ideas taken from the satirical `✨ Features`]
    - [Specifically describe the ideas taken from the `✨ Features` in the satire]]

    🗺️ ROADMAP TO THE MOON (AND BEYOND)
    =====================================
    Q1 2025: [goals]
    Q2 2025: [goals]
    Q3 2025: [goals]
    Q4 2025: [goals]

    ⚠️ Important: Write everything in English, be funny with a serious tone, and write in a similar style to the satire created in the previous step.
                  Pretend this is an official whitepaper presented to serious investors, but the content is absurd. Never break character. 


    Output must be JSON object including contents you wrote

  expected_output: >
    Your response MUST be valid JSON, like this:
    {
      "name": "Token name"
      "contents": "..."
    }
    Do not include any markdown, explanations, or extra keys.

  agent: website_contents_writer

select_layout_palette:
  description: >
    You will receive a JSON object from the previous task (extract_token_moods), which contains token name and three mood keywords 

    The JSON object input will look like this:
    {"name":..., "mood_keywords":[...]}

    Goal:
      - Read mood_keywords from input
      - Select exactly ONE CATALOG that best match, from the fixed lists in catalog.json
      - Extract the specified style from catalog.json, create it as a JSON object, and export it as output.

    Constraints:
      - You must select only from the provided lists (no new names)
      - For the same input, the selection must remain consistent (deterministic)

    Save the results into 'output/moods/selected_designs.json' (for persistence)
    Also RETURN the JSON Object so the next task can use it from context

  expected_output: >
    Your response MUST be valid JSON, like this:
    {
      "name": "Token name"
      "catalog": Dict{"catalog you selected"}
    }
    Do not include any markdown, explanations, or extra keys.

  agent: design_recommender

build_meme_token_sites:
  description: >
    You will receive a JSON object and txt from the previous tasks (select_layout_palette, write_website_contents), which contains token name and catalog for building website and tokeonomics and roadmaps

    JSON input (select_layout_palette output) will look like:
      {"name": "...", "catalog": {...}}

    JSON input (write_website_contents output) will look like:
      {
        "name": "..."
        "contents": "..."
      }

    Goal:
      - Use the catalog specified in input **exactly as given**
        - Generate a TailwindCSS + Google Fonts **index.html** applying ALL of the following from the catalog:
        - section order (reorder DOM to match exactly ["hero","about","tokenomics","community"])
        - hero alignment (left|center|right)
        - image position (top|left|right for the hero media block)
        - typography style (title_font for headings/CTAs, body_font for body text)
        - components style (button/badge/section styles mapped into CSS)
        - color palette (background, primary, text_rule, accent_rule)
      - Apply horizontal page-wide padding by adding a Tailwind px-* class to the <body> element.
      - Apply a vertical gap of ~32px between sections using Tailwind space-y-6 on the parent container
      - **Color richness (required):** Use primary **and** accent_rule widely (CTA, links, badges, chips, section headers, card borders) to avoid monotony. Background must be exactly palette.background.
      - **Component variety (required):**
        - Buttons: provide at least **3 variants** (primary / outline / ghost) styled from catalog.components.button
          (respect border, radius, fill/gradient, shadow). Ghost = transparent bg, Outline = strong border.
        - Badges: at least **2 variants** (e.g., pill + dashed/stamp) from catalog.components.badge.
        - Cards/Sections: at least **2 variants** (e.g., plain frame + sticker/double/hazard) from catalog.components.section.
      - **Content binding (required):** Parse website_contents.txt and render:
        - Tokenomics list under **#tokenomics**
        - Roadmap phases/cards under **#roadmap**
        - “⚠️ Important:” disclaimer appended to tokenomics section
      - you must use txt input for tokeonomics and roadmaps section
      - The HTML landing page must include a button that, when clicked, links to its corresponding section (e.g., a "Roadmap" button links to the Roadmap section).
      - The background color of the website must be the background color specified in the catalog.
      - Utilize the entire color palette and all component styles from the catalog to their fullest extent.
      - In index.html, include the logo with:
        <img src="images/token_image.png" alt="site logo" width="200" height="200">
      - “⚠️ Very Important:” All images used on our website must not exceed 200x200 pixels.
      - Save the site to 'output/site/index.html' using 'site_writer_tool'

    Constraints:
      - Do NOT re-select or change the catalog
      - HTML must implement: section order, hero alignment, image position, typography style,
        components style,and palette colors exactly

  expected_output: >
    A styled landing page at 'output/site/index.html'

  agent: meme_token_site_designer
